bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform:
      - "debian11"
      - "ubuntu2204"
      - "ubuntu2404"
  tasks:
    run_tests_bazel8:
      name: "Run smoke tests (Bazel 8.5.1 strict lock)"
      platform: ${{ platform }}
      bazel: "8.5.1"
      test_flags:
        - "--lockfile_mode=error"
      test_targets:
        - "//..."
    run_tests_bazel9:
      name: "Run smoke tests (Bazel 9.2.0 compatibility)"
      platform: ${{ platform }}
      bazel: "9.2.0"
      test_flags:
        - "--lockfile_mode=off"
      test_targets:
        - "//..."
