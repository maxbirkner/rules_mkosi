name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Bazel ${{ matrix.bazel }} / ${{ matrix.module }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - "8.5.1"
          - "9.2.0"
        module:
          - "."
          - "e2e/smoke"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: rules-mkosi-${{ matrix.bazel }}
          external-cache: true
          module-root: ${{ matrix.module }}
          repository-cache: true

      - name: Verify pinned Bazel version
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"

      - name: Run test suite
        run: |
          run_bazel() {
            sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
              --clear-groups env HOME="$HOME" PATH="$PATH" "$@"
          }
          run_bazel sh -c '
            groups=
            while IFS= read -r line; do
              case "$line" in Groups:*) groups="${line#Groups:}" ;; esac
            done < /proc/self/status
            case "$groups" in
              *[![:space:]]*) echo "supplementary groups were not cleared" >&2; exit 1 ;;
            esac
            echo "CI bootstrap identity has empty supplementary groups"
          '
          if [ "${{ matrix.bazel }}" = "8.5.1" ]; then
            run_bazel bazel test --lockfile_mode=error //...
          else
            # Bazel 9 uses a newer lockfile format; compatibility is tested
            # without rewriting the committed Bazel 8 lockfile.
            run_bazel bazel test --lockfile_mode=off //...
          fi

      - name: Validate manifest-only public launcher
        if: matrix.module == '.'
        run: |
          run_bazel() {
            sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
              --clear-groups env HOME="$HOME" PATH="$PATH" "$@"
          }
          if [ "${{ matrix.bazel }}" = "8.5.1" ]; then
            run_bazel bazel test --enable_runfiles=no --lockfile_mode=error \
              //mkosi/tests:debian_tools_launcher_probe_test
          else
            run_bazel bazel test --enable_runfiles=no --lockfile_mode=off \
              //mkosi/tests:debian_tools_launcher_probe_test
          fi

      - name: Audit Debian tools action graph
        if: matrix.module == '.'
        run: |
          run_bazel() {
            sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
              --clear-groups env HOME="$HOME" PATH="$PATH" "$@"
          }
          if [ "${{ matrix.bazel }}" = "8.5.1" ]; then
            mode=error
          else
            mode=off
          fi
          graph="$(run_bazel bazel aquery --lockfile_mode="${mode}" --output=text \
            'deps(@mkosi_debian_tools//:launcher)')"
          case "$graph" in
            *"/bin/bash"*|*"local_config_cc"*)
              echo "host compiler or shell leaked into Debian tools graph" >&2
              exit 1
              ;;
          esac
          case "$graph" in
            *"BuildDebianToolsArchive"*|*"BuildHermeticDebianBootstrap"*) ;;
            *) echo "Debian tools hermetic actions are missing" >&2; exit 1 ;;
          esac
          case "$graph" in
            *"mkosi_debian_python/lib/"*) ;;
            *) echo "declared static Python library tree is missing" >&2; exit 1 ;;
          esac
          image_graph="$(run_bazel bazel aquery --lockfile_mode="${mode}" --output=text \
            'mnemonic("MkosiImage", //mkosi/tests:real_image)')"
          case "$image_graph" in
            *"python3"*"/mkosi/__main__.py"*) ;;
            *) echo "mkosi image action is not using the direct managed-Python entrypoint" >&2; exit 1 ;;
          esac
          case "$image_graph" in
            *"Environment: [PATH=, PYTHONNOUSERSITE=1, PYTHONPATH="*) ;;
            *) echo "mkosi image action environment is not hermetically declared" >&2; exit 1 ;;
          esac
          case "$image_graph" in
            *"mkosi_cli"*|*"mkosi_launcher.sh"*)
              echo "host-shell mkosi launcher leaked into the image action" >&2
              exit 1
              ;;
          esac
          case "$image_graph" in
            *"ExecutionInfo: {no-cache: 1, no-remote-exec: 1, requires-network: 1}"*) ;;
            *) echo "mkosi image execution requirements are incomplete" >&2; exit 1 ;;
          esac
          case "$image_graph" in
            *"--format=disk"*"--output-extension=raw"*"--compress-output=none"*"--split-artifacts="*) ;;
            *) echo "mkosi image output contract overrides are missing" >&2; exit 1 ;;
          esac
          run_bazel bazel aquery --lockfile_mode="${mode}" --output=jsonproto \
            'deps(@mkosi_debian_tools//:launcher)' > debian-tools-aquery.json
          python3 - debian-tools-aquery.json <<'PY'
          import json
          import sys

          graph = json.load(open(sys.argv[1], encoding="utf-8"))
          archive = []
          compilation = []
          fragments = {
              fragment["id"]: fragment for fragment in graph["pathFragments"]
          }
          artifacts = {
              artifact["id"]: artifact for artifact in graph["artifacts"]
          }
          dep_sets = {
              dep_set["id"]: dep_set for dep_set in graph["depSetOfFiles"]
          }

          def path(fragment_id):
              parts = []
              while fragment_id:
                  fragment = fragments[fragment_id]
                  parts.append(fragment["label"])
                  fragment_id = fragment.get("parentId")
              return "/".join(reversed(parts))

          artifact_paths = {
              artifact_id: path(artifact["pathFragmentId"])
              for artifact_id, artifact in artifacts.items()
          }

          def input_paths(action):
              paths = set()
              for artifact_id in input_artifact_ids(action):
                  paths.add(artifact_paths[artifact_id])
              return paths

          def input_artifact_ids(action):
              artifacts = set()
              seen = set()

              def collect(dep_set_id):
                  if dep_set_id in seen:
                      return
                  seen.add(dep_set_id)
                  dep_set = dep_sets[dep_set_id]
                  artifacts.update(dep_set.get("directArtifactIds", []))
                  for child in dep_set.get("transitiveDepSetIds", []):
                      collect(child)

              for dep_set_id in action.get("inputDepSetIds", []):
                  collect(dep_set_id)
              return artifacts

          def allowed_input(path):
              if path.startswith(("bazel-out/", "mkosi/")):
                  return True
              if not path.startswith("external/"):
                  return False
              repository = path.split("/", 2)[1]
              return repository.startswith(
                  (
                      "bazel_tools",
                      "hermetic_cc_toolchain",
                      "rules_cc~",
                      "rules_cc+",
                      "_main~debian_tools~",
                      "+debian_tools+",
                  )
              )
          compiler_tokens = (
              "/bin/bash",
              "/usr/bin/gcc",
              "/usr/bin/clang",
              "/usr/bin/ar",
              "/usr/bin/ld",
              "/usr/bin/strip",
              "local_config_cc",
          )
          action_count = 0
          strip_actions = 0
          producers = {
              artifact_id: action
              for action in graph["actions"]
              for artifact_id in action.get("outputIds", [])
          }
          visiting = set()
          validated = set()

          def validate_action(action):
              action_id = action["actionKey"]
              if action_id in validated:
                  return
              if action_id in visiting:
                  raise SystemExit("cycle in producing action graph")
              visiting.add(action_id)
              arguments = action.get("arguments", [])
              inputs = input_paths(action)
              if action["mnemonic"] == "CcStrip":
                  if not arguments or arguments[0] != "/usr/bin/false":
                      raise SystemExit("unexpected strip executable")
              for token in arguments:
                  if (
                      token == "/usr/bin/false"
                      and action["mnemonic"] == "CcStrip"
                  ):
                      continue
                  if token.startswith("/") or any(
                      bad in token for bad in compiler_tokens
                  ):
                      raise SystemExit(
                          "host compiler or shell in structured action graph"
                      )
              for variable in action.get("environmentVariables", []):
                  value = variable.get("value", "")
                  if value.startswith("/") and value != "/proc/self/cwd":
                      raise SystemExit(
                          "host environment path in structured action graph"
                      )
              for artifact_id in input_artifact_ids(action):
                  path = artifact_paths[artifact_id]
                  if path.startswith("bazel-out/"):
                      if path.endswith(
                          ("volatile-status.txt", "stable-status.txt")
                      ):
                          continue
                      producer = producers.get(artifact_id)
                      if producer is None:
                          raise SystemExit(
                              "unproduced bazel-out input: " + path
                          )
                      validate_action(producer)
                  elif not allowed_input(path):
                      raise SystemExit(
                          "unexpected transitive tool/input roots: " + path
                      )
                  if any(bad in path for bad in compiler_tokens):
                      raise SystemExit(
                          "host compiler or shell in transitive input set"
                      )
              visiting.remove(action_id)
              validated.add(action_id)

          for action in graph["actions"]:
              action_count += 1
              arguments = action.get("arguments", [])
              inputs = input_paths(action)
              if action["mnemonic"] == "CcStrip":
                  strip_actions += 1
                  if not arguments or arguments[0] != "/usr/bin/false":
                      raise SystemExit("unexpected strip executable")
              if action["mnemonic"] == "BuildDebianToolsArchive":
                  archive.append((arguments, inputs))
              if action["mnemonic"] in ("CppCompile", "CppLink"):
                  compilation.append((action["mnemonic"], arguments, inputs))
              validate_action(action)
          print("structured actions audited:", action_count)
          print("CcStrip actions audited:", strip_actions,
                "(toolchain no-op placeholder, execution checked separately)")
          print("structured archive actions:", len(archive), [args[0][0] for args in archive if args[0]])
          if len(archive) < 1 or any(
              not args
              or "mkosi_debian_python" not in args[0][0]
              or "python3.11" not in args[0][0]
              for args in archive
          ):
              raise SystemExit("archive action lacks complete static Python inputs")
          if not any(
              mnemonic in ("CppCompile", "CppLink") and args
              for mnemonic, args, _ in compilation
          ):
              raise SystemExit("standard C++ toolchain actions are missing")
          print("structured C++ toolchain actions:", len(compilation))
          print("structured action graph: archive=static-python standard-cc=resolved")
          PY
          rm debian-tools-aquery.json
          for target in launcher namespace_runner
          do
            definition="$(run_bazel bazel cquery --lockfile_mode="${mode}" \
              --output=build "@mkosi_debian_tools//:${target}")"
            case "$definition" in
              *"exec_compatible_with"*) ;;
              *) echo "direct ${target} target lacks exec constraints" >&2; exit 1 ;;
            esac
            case "$definition" in
              *"target_compatible_with"*) ;;
              *) echo "direct ${target} target lacks target constraints" >&2; exit 1 ;;
            esac
            case "$definition" in
              *"@platforms//os:linux"*'"@platforms//cpu:x86_64"'*) ;;
              *) echo "direct ${target} target lacks Linux x86-64 constraints" >&2; exit 1 ;;
            esac
          done
          echo "Debian tools archive/bootstrap graph contains only managed actions"

      - name: Verify downstream no-RC toolchain default
        run: |
          run_bazel() {
            sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
              --clear-groups env HOME="$HOME" PATH="$PATH" "$@"
          }
          mode=off
          if [ "${{ matrix.bazel }}" = "8.5.1" ]; then
            mode=error
          fi
          graph="$(run_bazel bazel --bazelrc=/dev/null aquery \
            --lockfile_mode="${mode}" --output=text \
            'deps(@mkosi_debian_tools//:launcher)')"
          case "$graph" in
            *"local_config_cc"*|*"/usr/bin/gcc"*|*"/usr/bin/clang"*)
              echo "downstream no-RC graph selected a host C++ toolchain" >&2
              exit 1
              ;;
          esac
          case "$graph" in
            *"hermetic_cc_toolchain"*) ;;
            *) echo "downstream no-RC graph lacks maintained C++ toolchain" >&2; exit 1 ;;
          esac
          echo "no-RC downstream launcher resolves maintained hermetic C++ toolchain"

      - name: Verify Linux sandbox helper
        if: matrix.module == '.'
        run: |
          run_bazel() {
            sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
              --clear-groups env HOME="$HOME" PATH="$PATH" "$@"
          }
          mode=error
          if [ "${{ matrix.bazel }}" = "9.2.0" ]; then
            mode=off
          fi
          install_base="$(run_bazel bazel info --lockfile_mode="$mode" install_base)"
          test -x "${install_base}/linux-sandbox"
          "${install_base}/linux-sandbox" /bin/true

      - name: Qualify host kernel in Bazel sandbox
        if: matrix.module == '.'
        run: |
          run_bazel() {
            sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
              --clear-groups env HOME="$HOME" PATH="$PATH" "$@"
          }
          mode=error
          if [ "${{ matrix.bazel }}" = "9.2.0" ]; then
            mode=off
          fi
          run_bazel bazel shutdown
          set -o pipefail
          run_bazel bazel test --lockfile_mode="$mode" --config=kernel_preflight \
            //mkosi/private:kernel_preflight_host_test 2>&1 |
            tee kernel-preflight.log
          grep -F "Executed 1 out of 1 test" kernel-preflight.log
          ! grep -F "(cached)" kernel-preflight.log
          rm kernel-preflight.log

  namespace-contract:
    name: Namespace production contract
    runs-on: ubuntu-22.04
    env:
      USE_BAZEL_VERSION: "8.5.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          external-cache: true
          repository-cache: true

      - name: Run production namespace and image targets
        run: |
          # setpriv is CI setup only. It establishes the required empty group
          # vector before Bazel starts; it is not a rule or action dependency.
          sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups env HOME="$HOME" PATH="$PATH" sh -eu -c '
              groups=
              while IFS= read -r line; do
                case "$line" in Groups:*) groups="${line#Groups:}" ;; esac
              done < /proc/self/status
              case "$groups" in
                *[![:space:]]*) echo "CI namespace lane has supplementary groups" >&2; exit 1 ;;
              esac
              echo "CI namespace lane: Groups: (empty)"
              bazel shutdown
              bazel test --lockfile_mode=error --disk_cache= \
                --cache_test_results=no --config=kernel_preflight \
                //mkosi/private:kernel_preflight_host_test
              override_graph="$(bazel aquery --lockfile_mode=error --output=text \
                "mnemonic(\"MkosiImage\", //mkosi/tests:override_subject)")"
              case "$override_graph" in
                *"redirect.conf"*"override_subject.raw"*) ;;
                *) echo "redirect config is not the override image dependency" >&2; exit 1 ;;
              esac
              bazel test --lockfile_mode=error --disk_cache= \
                --cache_test_results=no --spawn_strategy=linux-sandbox \
                --test_output=all \
                //mkosi/tests:debian_tools_launcher_probe_test \
                //mkosi/tests:debian_tools_runtime_test \
                //mkosi/tests:debian_tools_recursive_ro_test \
                //mkosi/tests:debian_tools_manifest_test \
                //mkosi/tests:debian_tools_fd_swap_test \
                //mkosi/tests:real_image_artifact_test \
                //mkosi/tests:override_image_artifact_test \
                //mkosi/tests:raw_image_corruption_test
              cd e2e/smoke
              bazel shutdown
              bazel test --lockfile_mode=error --disk_cache= \
                --cache_test_results=no --spawn_strategy=linux-sandbox \
                --test_output=all \
                //:demo_artifact_test \
                //:raw_image_corruption_test \
                //:boot_launcher_contract_test \
                //:demo_boot_test
              bazel test --lockfile_mode=error --disk_cache= \
                --cache_test_results=no --spawn_strategy=linux-sandbox \
                --test_strategy=exclusive --enable_runfiles=no \
                --test_output=all \
                //:boot_launcher_contract_test \
                //:demo_boot_test
            '

  lockfile:
    name: Bazel lockfile
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: "8.5.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          repository-cache: true

      - name: Verify committed lockfile
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel 8.5.1"
          bazel mod deps --lockfile_mode=error

      - name: Verify committed e2e lockfile
        working-directory: e2e/smoke
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel 8.5.1"
          bazel mod deps --lockfile_mode=error

  module-resolution:
    name: Module resolution ${{ matrix.bazel }} / ${{ matrix.fixture }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - "8.5.1"
          - "9.2.0"
        fixture:
          - default
          - explicit
          - unsupported
          - conflicting_root
          - nonroot_name
          - root_dependency
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: rules-mkosi-module-${{ matrix.bazel }}-${{ matrix.fixture }}
          repository-cache: true

      - name: Test module resolution fixture
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"
          LOCKFILE_MODE=off e2e/module_resolution/test.sh ${{ matrix.fixture }}

  lint:
    name: prek
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true
          prek-version: "0.5.0"

  bootstrap-determinism:
    name: Deterministic bootstrap binaries
    runs-on: ubuntu-22.04
    env:
      USE_BAZEL_VERSION: "8.5.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          external-cache: true
          repository-cache: true

      - name: Verify deterministic bootstrap binaries
        run: |
          run_bazel() {
            sudo -n setpriv --reuid="$(id -u)" --regid="$(id -g)" \
              --clear-groups env HOME="$HOME" PATH="$PATH" "$@"
          }
          output_a="$GITHUB_WORKSPACE/.ci-output-a"
          output_b="$GITHUB_WORKSPACE/.ci-output-b"
          execution_log="$GITHUB_WORKSPACE/.ci-execution-log.json"
          rm -rf "$output_a" "$output_b"
          rm -f "$execution_log"
          run_bazel bazel --output_base="$output_a" build \
            --lockfile_mode=error --disk_cache= \
            --execution_log_json_file="$execution_log" \
            --noremote_accept_cached --noremote_upload_local_results \
            @mkosi_debian_tools//:launcher \
            @mkosi_debian_tools//:namespace_runner
          first_launcher="$(run_bazel bazel --output_base="$output_a" cquery \
            --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:launcher | tail -n 1)"
          first_runner="$(run_bazel bazel --output_base="$output_a" cquery \
            --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:namespace_runner | tail -n 1)"
          first_launcher_sha="$(sha256sum "$first_launcher" | cut -d' ' -f1)"
          first_runner_sha="$(sha256sum "$first_runner" | cut -d' ' -f1)"
          python3 - "$execution_log" <<'PY'
          import json
          import sys

          decoder = json.JSONDecoder()
          text = open(sys.argv[1], encoding="utf-8").read()
          offset = 0
          records = 0
          while offset < len(text):
              while offset < len(text) and text[offset].isspace():
                  offset += 1
              if offset == len(text):
                  break
              record, offset = decoder.raw_decode(text, offset)
              records += 1
              if "/usr/bin/false" in record.get("commandArgs", []):
                  raise SystemExit("CcStrip placeholder was executed")
          if records == 0:
              raise SystemExit("uncached bootstrap execution log is empty")
          print("uncached bootstrap execution records:", records)
          print("CcStrip /usr/bin/false execution records: 0")
          PY
          run_bazel bazel --output_base="$output_b" build \
            --lockfile_mode=error --disk_cache= \
            --noremote_accept_cached --noremote_upload_local_results \
            @mkosi_debian_tools//:launcher \
            @mkosi_debian_tools//:namespace_runner
          second_launcher="$(run_bazel bazel --output_base="$output_b" cquery \
            --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:launcher | tail -n 1)"
          second_runner="$(run_bazel bazel --output_base="$output_b" cquery \
            --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:namespace_runner | tail -n 1)"
          test "$first_launcher_sha" = "$(sha256sum "$second_launcher" | cut -d' ' -f1)"
          test "$first_runner_sha" = "$(sha256sum "$second_runner" | cut -d' ' -f1)"
          echo "clean rebuild launcher SHA: $first_launcher_sha"
          echo "clean rebuild namespace runner SHA: $first_runner_sha"
          rm -rf "$output_a" "$output_b" "$execution_log"

  conclusion:
    name: CI conclusion
    if: always()
    needs:
      - lint
      - lockfile
      - test
      - namespace-contract
      - module-resolution
      - bootstrap-determinism
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |-
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
