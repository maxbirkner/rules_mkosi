name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Bazel ${{ matrix.bazel }} / ${{ matrix.module }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - "7.x"
          - "8.x"
          - "9.x"
        module:
          - "."
          - "e2e/smoke"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: rules-mkosi-${{ matrix.bazel }}
          repository-cache: true

      - name: Run test suite
        run: bazel test --lockfile_mode=update //...

      - name: Qualify host kernel in Linux sandbox
        if: matrix.module == '.'
        run: >-
          bazel test -c opt --spawn_strategy=linux-sandbox
          --strategy=TestRunner=linux-sandbox --test_output=all
          //mkosi/private:kernel_preflight_host_test

  lockfile:
    name: Bazel lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Verify committed lockfile
        run: bazel mod deps --lockfile_mode=error

  lint:
    name: prek
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true
          prek-version: "0.5.0"

  conclusion:
    name: CI conclusion
    if: always()
    needs:
      - lint
      - lockfile
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |-
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
