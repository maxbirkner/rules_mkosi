name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload the generated disk and metadata for manual testing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bazel-versions:
    name: Bazel versions
    uses: ./.github/workflows/read-bazel-versions.yml

  test:
    name: >-
      Qualified Bazel ${{ matrix.bazel }} /
      ${{ matrix.suite != 'audit' && matrix.label ||
      matrix.bazel == needs.bazel-versions.outputs.default && 'release reproducibility and audits' ||
      'audits' }}
    needs: bazel-versions
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.bazel-versions.outputs.tested) }}
        suite:
          - root
          - consumer
          - audit
        # Suites run as independent jobs on separate runners. Each suite owns
        # its cache namespace so concurrent saves cannot replace another
        # suite's entries; the audit suite only reads the root suite's caches.
        # Bazelisk runs the root module through tools/bazel, which pins the
        # module-local .cache/bazel-disk, so only the consumer saves a disk cache.
        # The root and audit suites keep the runner's supplementary groups, as a
        # normally started Bazel server does; the consumer suite clears them.
        # The consumer suite also sandboxes actions on a nosuid,nodev mount, like
        # a /dev/shm sandbox base, whose locked flags the namespace runner keeps.
        include:
          - suite: root
            label: root suite
            module: .
            server-groups: kept
            cache-save: true
            disk-cache: "false"
            external-cache: root
            repository-cache: "true"
          - suite: consumer
            label: consumer suite
            module: e2e/smoke
            server-groups: cleared
            restricted-sandbox: true
            cache-save: true
            disk-cache: consumer
            external-cache: consumer
            repository-cache: '["MODULE.bazel", "e2e/smoke/MODULE.bazel"]'
          - suite: audit
            module: ""
            server-groups: kept
            cache-save: false
            disk-cache: "false"
            external-cache: root
            repository-cache: "true"
    env:
      DEFAULT_BAZEL_VERSION: ${{ needs.bazel-versions.outputs.default }}
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      SERVER_GROUPS: ${{ matrix.server-groups }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Put CI helpers on PATH
        run: echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0
          cache-save: ${{ github.event_name != 'pull_request' && matrix.cache-save }}
          disk-cache: >-
            ${{ matrix.disk-cache != 'false' &&
            format('rules-mkosi-{0}-{1}', matrix.bazel, matrix.disk-cache) ||
            'false' }}
          external-cache: |
            name: qualified-${{ matrix.external-cache }}
          repository-cache: ${{ matrix.repository-cache }}

      - name: Verify pinned Bazel version
        run: |
          bazel version 2>&1 | grep -Fx "Bazelisk version: v1.28.0"
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"

      - name: Enable KVM for QEMU boot tests
        if: matrix.module != ''
        run: |
          # A Bazel server without supplementary groups cannot use kvm group
          # membership, so open the device to every user in every suite.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          server-identity sh -c ': <> /dev/kvm'
          echo "The Bazel server identity can open /dev/kvm for reading and writing."

      - name: Qualify host kernel
        run: |
          expected_bazel_version="bazel ${{ matrix.bazel }}"
          test "$(server-identity bazel --version)" = "$expected_bazel_version"
          (
            cd e2e/smoke
            test "$(server-identity bazel --version)" = "$expected_bazel_version"
          )
          preflight_configs=()
          if [ "$USE_BAZEL_VERSION" != "$DEFAULT_BAZEL_VERSION" ]; then
            preflight_configs=(--config=bazel9)
          fi
          server-identity bazel shutdown
          set -o pipefail
          server-identity bazel test --config=kernel_preflight \
            "${preflight_configs[@]}" //... 2>&1 | tee kernel-preflight.log
          grep -F "Executed 1 out of 1 test" kernel-preflight.log
          if grep -F "(cached)" kernel-preflight.log; then
            echo "kernel preflight result was cached" >&2
            exit 1
          fi
          rm kernel-preflight.log

      - name: Run complete ${{ matrix.label }}
        id: qualification
        if: matrix.module != ''
        working-directory: ${{ matrix.module }}
        run: |
          if [ "$USE_BAZEL_VERSION" != "$DEFAULT_BAZEL_VERSION" ]; then
            # Other Bazel versions may use another lockfile format; they are
            # tested without rewriting the committed lockfiles.
            bazel_configs=(--config=portable --config=bazel9)
            manifest_configs=(--config=manifest --config=bazel9)
          else
            bazel_configs=(--config=qualified)
            manifest_configs=(--config=manifest)
          fi
          if [ "${{ matrix.restricted-sandbox }}" = "true" ]; then
            # Disk-backed, because the consumer suite's parallel image actions
            # do not fit into the runner's RAM-backed /dev/shm.
            sandbox_base="$RUNNER_TEMP/restricted-sandbox"
            mkdir "$sandbox_base"
            sudo mount --bind "$sandbox_base" "$sandbox_base"
            sudo mount -o remount,bind,nosuid,nodev "$sandbox_base"
            findmnt --noheadings --output OPTIONS --mountpoint "$sandbox_base" |
              grep -E '(^|,)nosuid(,|$)' | grep -E '(^|,)nodev(,|$)'
            bazel_configs+=(--sandbox_base="$sandbox_base")
            manifest_configs+=(--sandbox_base="$sandbox_base")
          fi
          # The preflight server ran from the repository root, and every module
          # in this job shares the output base configured by setup-bazel.
          server-identity bazel shutdown
          server-identity bazel test "${bazel_configs[@]}" //...
          server-identity bazel test "${manifest_configs[@]}" //...

      - name: Verify the QEMU fallback from KVM to TCG
        if: matrix.suite == 'root'
        run: |
          version_configs=()
          if [ "$USE_BAZEL_VERSION" != "$DEFAULT_BAZEL_VERSION" ]; then
            version_configs=(--config=bazel9)
          fi
          target=//mkosi/tests:qemu_ovmf_smoke_test
          testlogs="$(server-identity bazel info "${version_configs[@]}" bazel-testlogs)"
          test_log="$testlogs/mkosi/tests/qemu_ovmf_smoke_test/test.log"
          # The same test uses KVM while /dev/kvm is usable and TCG once it is hidden.
          server-identity bazel test --config=qualified_runtime "${version_configs[@]}" "$target"
          grep -Fx "QEMU accelerator: kvm" "$test_log"
          server-identity bazel test --config=kvm_unavailable "${version_configs[@]}" "$target"
          grep -Fx "QEMU accelerator: tcg" "$test_log"

      - name: Verify release reproducibility
        if: matrix.suite == 'audit' && matrix.bazel == env.DEFAULT_BAZEL_VERSION
        run: |
          server-identity ./ci/verify-release-reproducibility.sh

      - name: Verify two-stage base reuse
        if: matrix.suite == 'audit' && matrix.bazel == env.DEFAULT_BAZEL_VERSION
        run: |
          server-identity ./ci/verify-two-stage-cache.sh

      - name: Surface retained boot evidence
        id: boot_evidence
        if: always() && matrix.module != ''
        working-directory: ${{ matrix.module }}
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          module="${{ matrix.suite }}"
          evidence_dir="$RUNNER_TEMP/boot-evidence-${{ matrix.bazel }}-$module"
          mkdir -p "$evidence_dir"
          echo "has_evidence=false" >> "$GITHUB_OUTPUT"
          info_configs=()
          if [ "$USE_BAZEL_VERSION" != "$DEFAULT_BAZEL_VERSION" ]; then
            info_configs=(--config=bazel9)
          fi
          has_evidence=false
          has_bios_evidence=false
          has_tcg_evidence=false
          if ! testlogs="$(
            server-identity bazel info "${info_configs[@]}" bazel-testlogs
          )"; then
            echo "The $module Bazel testlogs path is unavailable."
          elif [ ! -d "$testlogs" ]; then
            echo "No $module Bazel testlogs directory was created: $testlogs"
          else
            while IFS= read -r evidence; do
              relative="${evidence#"$testlogs"/}"
              target_dir="${relative%/test.outputs/boot-evidence.log}"
              destination="$evidence_dir/$module/$target_dir"
              mkdir -p "$destination/test.outputs"
              cp -- "$evidence" \
                "$destination/test.outputs/boot-evidence.log"
              for log in firmware.log guest-serial.log qemu.log; do
                source="${evidence%boot-evidence.log}$log"
                if [ -f "$source" ]; then
                  cp -- "$source" "$destination/test.outputs/$log"
                fi
              done
              test_log="${evidence%/test.outputs/boot-evidence.log}/test.log"
              if [ -f "$test_log" ]; then
                cp -- "$test_log" "$destination/test.log"
              fi
              echo "===== $module/$target_dir ====="
              cat -- "$evidence"
              has_evidence=true
              case "$target_dir" in
                *bios_boot_test)
                  if grep -Fxq "[qemu] accelerator: kvm" "$evidence" &&
                    grep -Fq "SeaBIOS (version " "$evidence" &&
                    grep -Fq "Booting from Hard Disk" "$evidence" &&
                    grep -Fq "GRUB" "$evidence" &&
                    grep -Fq "Linux version" "$evidence" &&
                    grep -Fq "Hostname set to <rules-mkosi-bios>" "$evidence" &&
                    grep -Fq "systemd-shutdown[1]: Powering off." "$evidence" &&
                    grep -Fq "reboot: Power down" "$evidence"; then
                    has_bios_evidence=true
                  fi
                  ;;
                *uefi_boot_test)
                  if grep -Fxq "[qemu] accelerator: tcg" "$evidence" &&
                    grep -Fq "systemd-shutdown[1]: Powering off." "$evidence" &&
                    grep -Fq "reboot: Power down" "$evidence"; then
                    has_tcg_evidence=true
                  fi
                  ;;
              esac
            done < <(find "$testlogs" -type f \
              -path '*/test.outputs/boot-evidence.log' -print)
          fi
          if $has_evidence; then
            echo "has_evidence=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$QUALIFICATION_OUTCOME" = "success" ]; then
            if ! $has_bios_evidence; then
              echo "Successful qualification produced no complete KVM BIOS boot evidence." >&2
              exit 1
            fi
            if [ "$module" = "consumer" ] && ! $has_tcg_evidence; then
              echo "Successful qualification produced no complete forced-TCG UEFI boot evidence." >&2
              exit 1
            fi
          elif ! $has_evidence; then
            echo "Qualification failed before bounded boot evidence was created."
          fi

      - name: Upload retained boot evidence
        if: >-
          always() &&
          steps.boot_evidence.outputs.has_evidence == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-evidence-bazel-${{ matrix.bazel }}-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/boot-evidence-${{ matrix.bazel }}-${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Stage image artifacts for manual testing
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_artifacts &&
          matrix.bazel == env.DEFAULT_BAZEL_VERSION &&
          matrix.suite == 'root'
        run: |
          artifact_dir="$RUNNER_TEMP/mkosi-manual-test"
          mkdir -p "$artifact_dir"
          targets=(
            //mkosi/tests:release_subject
            //mkosi/tests:release_reproducibility
          )
          server-identity bazel build --config=qualified "${targets[@]}"
          while IFS= read -r output; do
            destination="$artifact_dir/$(basename "$output")"
            if [ -e "$destination" ]; then
              echo "duplicate artifact basename: $destination" >&2
              exit 1
            fi
            cp --reflink=auto "$output" "$destination"
          done < <(
            server-identity bazel cquery --config=qualified --output=files \
              "set(${targets[*]})"
          )
          expected=(
            release_subject.raw
            release_subject.mkosi-image-info.json
            release_subject.partitions.json
            release_reproducibility.reproducibility.json
          )
          for output in "${expected[@]}"; do
            test -s "$artifact_dir/$output"
          done
          test "$(find "$artifact_dir" -maxdepth 1 -type f | wc -l)" -eq 4
          (
            cd "$artifact_dir"
            sha256sum -- * > SHA256SUMS
          )

      - name: Upload image artifacts for manual testing
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_artifacts &&
          matrix.bazel == env.DEFAULT_BAZEL_VERSION &&
          matrix.suite == 'root'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mkosi-manual-test-${{ github.sha }}
          path: ${{ runner.temp }}/mkosi-manual-test
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Audit Debian tools action graph
        if: matrix.suite == 'audit'
        run: |
          if [ "$USE_BAZEL_VERSION" = "$DEFAULT_BAZEL_VERSION" ]; then
            mode=error
          else
            mode=off
          fi
          graph="$(server-identity bazel aquery --lockfile_mode="${mode}" --output=text \
            'deps(@mkosi_debian_tools//:launcher)')"
          case "$graph" in
            *"/bin/bash"*|*"local_config_cc"*)
              echo "host compiler or shell leaked into Debian tools graph" >&2
              exit 1
              ;;
          esac
          case "$graph" in
            *"BuildDebianToolsArchive"*|*"BuildHermeticDebianBootstrap"*) ;;
            *) echo "Debian tools hermetic actions are missing" >&2; exit 1 ;;
          esac
          case "$graph" in
            *"mkosi_debian_python/lib/"*) ;;
            *) echo "declared static Python library tree is missing" >&2; exit 1 ;;
          esac
          case "$graph" in
            *"mkosi_pypi_314_click"*"/click/"*common.py*|*"mkosi_pypi_314_click"*"/click/"*core.py*) ;;
            *) echo "locked Click runtime is missing from Debian launcher runfiles" >&2; exit 1 ;;
          esac
          image_graph="$(server-identity bazel aquery --lockfile_mode="${mode}" --config=qualified --output=text \
            'mnemonic("MkosiImage", //mkosi/tests:real_image)')"
          case "$image_graph" in
            *"python3"*"/mkosi/__main__.py"*) ;;
            *) echo "mkosi image action is not using the direct managed-Python entrypoint" >&2; exit 1 ;;
          esac
          server-identity bazel aquery --lockfile_mode="${mode}" --config=qualified --output=jsonproto \
            'mnemonic("MkosiImage", set(//mkosi/tests:real_image //mkosi/tests:release_subject))' \
            > image-aquery.json
          python3 ci/image_environment_validator.py image-aquery.json
          rm image-aquery.json
          case "$image_graph" in
            *"mkosi_cli"*|*"mkosi_launcher.sh"*)
              echo "host-shell mkosi launcher leaked into the image action" >&2
              exit 1
              ;;
          esac
          case "$image_graph" in
            *"ExecutionInfo: {block-network: 1, no-cache: 1, no-remote-exec: 1}"*) ;;
            *) echo "offline tracer image execution requirements are incomplete" >&2; exit 1 ;;
          esac
          release_image_graph="$(server-identity bazel aquery --lockfile_mode="${mode}" --config=qualified --output=text \
            'mnemonic("MkosiImage", //mkosi/tests:release_subject)')"
          case "$release_image_graph" in
            *"repository_repository"*"--debian-snapshot-repository"*) ;;
            *) echo "release image does not consume the authenticated Debian snapshot" >&2; exit 1 ;;
          esac
          case "$release_image_graph" in
            *"ExecutionInfo: {block-network: 1, no-remote-exec: 1}"*) ;;
            *) echo "release image execution requirements are incomplete" >&2; exit 1 ;;
          esac
          case "$release_image_graph" in
            *"requires-network"*|*"no-cache"*)
              echo "release image retained a tracer-only execution requirement" >&2
              exit 1
              ;;
          esac
          case "$image_graph" in
            *"--format=disk"*"--output-extension=raw"*"--compress-output=none"*"--split-artifacts="*) ;;
            *) echo "mkosi image output contract overrides are missing" >&2; exit 1 ;;
          esac
          server-identity bazel aquery --lockfile_mode="${mode}" --output=jsonproto \
            'deps(@mkosi_debian_tools//:launcher)' > debian-tools-aquery.json
          python3 ci/action_graph_validator.py debian-tools-aquery.json
          # The same graph with an injected host shell and tar must fail the audit.
          server-identity bazel aquery --lockfile_mode="${mode}" --output=jsonproto \
            'deps(//ci:injected_host_helper)' > injected-aquery.json
          if rejection="$(python3 ci/action_graph_validator.py injected-aquery.json 2>&1)"; then
            echo "Debian tools graph audit accepted an injected host helper" >&2
            exit 1
          fi
          case "$rejection" in
            *"unmodeled action mnemonic: Genrule"*) echo "$rejection" ;;
            *) echo "Debian tools graph audit failed for another reason: $rejection" >&2; exit 1 ;;
          esac
          rm debian-tools-aquery.json injected-aquery.json
          for target in launcher namespace_runner
          do
            definition="$(server-identity bazel cquery --lockfile_mode="${mode}" \
              --output=build "@mkosi_debian_tools//:${target}")"
            case "$definition" in
              *"exec_compatible_with"*) ;;
              *) echo "direct ${target} target lacks exec constraints" >&2; exit 1 ;;
            esac
            case "$definition" in
              *"target_compatible_with"*) ;;
              *) echo "direct ${target} target lacks target constraints" >&2; exit 1 ;;
            esac
            case "$definition" in
              *"@platforms//os:linux"*'"@platforms//cpu:x86_64"'*) ;;
              *) echo "direct ${target} target lacks Linux x86-64 constraints" >&2; exit 1 ;;
            esac
          done
          echo "Debian tools archive/bootstrap graph contains only managed actions"

      - name: Verify downstream no-RC toolchain default
        if: matrix.suite == 'audit'
        run: |
          mode=off
          if [ "$USE_BAZEL_VERSION" = "$DEFAULT_BAZEL_VERSION" ]; then
            mode=error
          fi
          graph="$(server-identity bazel --bazelrc=/dev/null aquery \
            --lockfile_mode="${mode}" --output=text \
            'deps(@mkosi_debian_tools//:launcher)')"
          case "$graph" in
            *"local_config_cc"*|*"/usr/bin/gcc"*|*"/usr/bin/clang"*)
              echo "downstream no-RC graph selected a host C++ toolchain" >&2
              exit 1
              ;;
          esac
          case "$graph" in
            *"hermetic_cc_toolchain"*) ;;
            *) echo "downstream no-RC graph lacks maintained C++ toolchain" >&2; exit 1 ;;
          esac
          echo "no-RC downstream launcher resolves maintained hermetic C++ toolchain"

      - name: Verify Linux sandbox helper
        if: matrix.suite == 'audit'
        run: |
          mode=error
          if [ "$USE_BAZEL_VERSION" != "$DEFAULT_BAZEL_VERSION" ]; then
            mode=off
          fi
          install_base="$(server-identity bazel info --lockfile_mode="$mode" install_base)"
          test -x "${install_base}/linux-sandbox"
          "${install_base}/linux-sandbox" /bin/true

  namespace-contract:
    name: Namespace production contract
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Put CI helpers on PATH
        run: echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0
          cache-save: ${{ github.event_name != 'pull_request' }}
          external-cache: true
          repository-cache: true

      - name: Run production namespace and image targets
        run: |
          # shellcheck disable=SC2016 # The inner shell expands its own variables.
          group-free sh -eu -c '
              bazel shutdown
              override_graph="$(bazel aquery --lockfile_mode=error --output=text \
                "mnemonic(\"MkosiImage\", //mkosi/tests:override_subject)")"
              case "$override_graph" in
                *"redirect.conf"*"override_subject.raw"*) ;;
                *) echo "redirect config is not the override image dependency" >&2; exit 1 ;;
              esac
            '

  lockfile:
    name: Bazel lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0
          cache-save: ${{ github.event_name != 'pull_request' }}
          repository-cache: true

      - name: Verify committed lockfiles
        run: ci/regen-lockfiles.sh --check

  module-resolution:
    name: Module resolution ${{ matrix.bazel }} / ${{ matrix.fixture }}
    needs: bazel-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.bazel-versions.outputs.tested) }}
        fixture:
          - default
          - explicit
          - unsupported
          - conflicting_root
          - nonroot_name
          - root_dependency
          - snapshot_name_conflict
          - consumer_isolation
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: rules-mkosi-module-${{ matrix.bazel }}-${{ matrix.fixture }}
          repository-cache: true

      - name: Test module resolution fixture
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"
          fixture_root="$GITHUB_WORKSPACE/e2e/module_resolution/${{ matrix.fixture }}"
          PATH="$GITHUB_WORKSPACE/tools:$PATH" \
            BAZEL="$GITHUB_WORKSPACE/tools/bazel" \
            LOCKFILE_MODE=off \
            e2e/module_resolution/test.sh ${{ matrix.fixture }}
          rc="$fixture_root/.cache/bazel-wrapper.bazelrc"
          test -f "$rc"
          grep -Fx \
            "build --disk_cache=$fixture_root/.cache/bazel-disk" "$rc"
          git -C "$GITHUB_WORKSPACE" check-ignore -q "$rc"
          case "${{ matrix.fixture }}" in
            default|explicit|consumer_isolation)
              cache="$fixture_root/.cache/bazel-disk"
              test -d "$cache"
              test "$(realpath "$cache")" = "$cache"
              git -C "$GITHUB_WORKSPACE" check-ignore -q "$cache"
              ;;
            *)
              test ! -e "$fixture_root/.cache/bazel-disk"
              ;;
          esac
          rm -rf "$fixture_root/.cache"

  lazy-toolchain-fetch:
    name: Lazy toolchain fetch ${{ matrix.bazel }} / ${{ matrix.module }}
    needs: bazel-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.bazel-versions.outputs.tested) }}
        module:
          - root
          - consumer
        include:
          - module: root
            directory: .
            # A plain sh_test, which resolves only the shell toolchain. The root module's own C/C++ targets use the
            # zig toolchain, so it has no consumer C/C++ target.
            target: //ci:check_pr_title_test
            options: --bootstrap-target @mkosi_debian_tools//:namespace_runner
          - module: consumer
            directory: e2e/smoke
            # A plain py_binary, which resolves the Python and C/C++ toolchains.
            target: //:payload_tree_generator
            options: >-
              --consumer-cc-target //consumer_cc
              --bootstrap-target @mkosi_debian_tools//:namespace_runner
    env:
      DEFAULT_BAZEL_VERSION: ${{ needs.bazel-versions.outputs.default }}
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0
          cache-save: ${{ github.event_name != 'pull_request' }}
          repository-cache: true

      - name: Analyse a target that uses no rules_mkosi toolchain
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"
          if [ "${{ matrix.bazel }}" != "$DEFAULT_BAZEL_VERSION" ]; then
            export LOCKFILE_MODE=off
          fi
          ci/check-lazy-toolchain-fetch.sh ${{ matrix.options }} ${{ matrix.directory }} ${{ matrix.target }}

  bcr-presubmit:
    name: BCR presubmit ${{ matrix.bazel }}
    needs: bazel-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.bazel-versions.outputs.tested) }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Run the stock-runner smoke tests from a source archive
        env:
          DEFAULT_BAZEL_VERSION: ${{ needs.bazel-versions.outputs.default }}
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"
          # Mirror .bcr/presubmit.yml: only the default version checks the committed lockfile.
          flags=()
          if [ "${{ matrix.bazel }}" != "$DEFAULT_BAZEL_VERSION" ]; then
            flags+=(--lockfile_mode=off)
          fi
          ci/bcr-presubmit.sh "$RUNNER_TEMP/bcr-presubmit" "${flags[@]}"

  lint:
    name: prek
    runs-on: ubuntu-24.04
    env:
      # ci/check_function_size.py rejects baseline entries that the pull request adds or raises.
      FUNCTION_SIZE_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The function-size check needs the merge base with the pull request's base commit.
          fetch-depth: 0

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true
          prek-version: "0.5.0"

  bootstrap-determinism:
    name: Deterministic bootstrap binaries
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Put CI helpers on PATH
        run: echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0
          cache-save: ${{ github.event_name != 'pull_request' }}
          external-cache: true
          repository-cache: true

      - name: Verify deterministic bootstrap binaries
        run: group-free ./ci/verify-bootstrap-reproducibility.sh

  conclusion:
    name: CI conclusion
    if: always()
    needs:
      - bazel-versions
      - lint
      - lockfile
      - test
      - namespace-contract
      - module-resolution
      - lazy-toolchain-fetch
      - bcr-presubmit
      - bootstrap-determinism
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |-
          # Keep this count in sync with the nine entries in `needs` above.
          # shellcheck disable=SC2086 # Split the space-separated results into positional parameters.
          set -- $RESULTS
          if [ "$#" -ne 9 ]; then
            echo "expected nine required CI results, got $#" >&2
            exit 1
          fi
          for result; do
            case "$result" in
              success) ;;
              *)
                echo "required CI job did not succeed: $result" >&2
                exit 1
                ;;
            esac
          done
