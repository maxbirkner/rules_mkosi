name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Bazel ${{ matrix.bazel }} / ${{ matrix.module }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - "7.7.1"
          - "8.5.1"
          - "9.2.0"
        module:
          - "."
          - "e2e/smoke"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: rules-mkosi-${{ matrix.bazel }}
          repository-cache: true

      - name: Verify pinned Bazel version
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"

      - name: Run test suite
        run: |
          if [ "${{ matrix.bazel }}" = "7.7.1" ]; then
            bazel test --lockfile_mode=error //...
          else
            # The committed format-13 lock is generated at the compatibility
            # floor.  Bazel 8/9 validate module resolution without rewriting
            # it, because those releases use newer lock formats.
            bazel test --lockfile_mode=off //...
          fi

      - name: Validate manifest-only public launcher
        if: matrix.module == '.'
        run: |
          if [ "${{ matrix.bazel }}" = "7.7.1" ]; then
            bazel test --enable_runfiles=no --lockfile_mode=error \
              //mkosi/tests:debian_tools_launcher_probe_test
          else
            bazel test --enable_runfiles=no --lockfile_mode=off \
              //mkosi/tests:debian_tools_launcher_probe_test
          fi

      - name: Audit Debian tools action graph
        if: matrix.module == '.'
        run: |
          if [ "${{ matrix.bazel }}" = "7.7.1" ]; then
            mode=error
          else
            mode=off
          fi
          graph="$(bazel aquery --lockfile_mode="${mode}" --output=text \
            'deps(@mkosi_debian_tools//:launcher)')"
          case "$graph" in
            *"/bin/bash"*|*"/usr/bin/gcc"*|*"/usr/bin/g++"*|*"/usr/bin/clang"*|*"/usr/bin/ar"*|*"/usr/bin/strip"*|*"/usr/bin/ld"*|*"local_config_cc"*)
              echo "host compiler or shell leaked into Debian tools graph" >&2
              exit 1
              ;;
          esac
          case "$graph" in
            *"BuildDebianToolsArchive"*|*"BuildHermeticDebianBootstrap"*) ;;
            *) echo "Debian tools hermetic actions are missing" >&2; exit 1 ;;
          esac
          bazel aquery --lockfile_mode="${mode}" --output=jsonproto \
            'deps(@mkosi_debian_tools//:launcher)' > debian-tools-aquery.json
          python3 - debian-tools-aquery.json <<'PY'
          import json
          import sys

          graph = json.load(open(sys.argv[1], encoding="utf-8"))
          archive = []
          bootstrap = []
          fragments = {
              fragment["id"]: fragment for fragment in graph["pathFragments"]
          }
          artifacts = {
              artifact["id"]: artifact for artifact in graph["artifacts"]
          }
          dep_sets = {
              dep_set["id"]: dep_set for dep_set in graph["depSetOfFiles"]
          }

          def path(fragment_id):
              parts = []
              while fragment_id:
                  fragment = fragments[fragment_id]
                  parts.append(fragment["label"])
                  fragment_id = fragment.get("parentId")
              return "/".join(reversed(parts))

          artifact_paths = {
              artifact_id: path(artifact["pathFragmentId"])
              for artifact_id, artifact in artifacts.items()
          }

          def input_paths(action):
              paths = set()
              seen = set()

              def collect(dep_set_id):
                  if dep_set_id in seen:
                      return
                  seen.add(dep_set_id)
                  dep_set = dep_sets[dep_set_id]
                  paths.update(
                      artifact_paths[artifact_id]
                      for artifact_id in dep_set["directArtifactIds"]
                  )
                  for child in dep_set.get("transitiveDepSetIds", []):
                      collect(child)

              for dep_set_id in action.get("inputDepSetIds", []):
                  collect(dep_set_id)
              return paths

          for action in graph["actions"]:
              arguments = action.get("arguments", [])
              inputs = input_paths(action)
              if action["mnemonic"] == "BuildDebianToolsArchive":
                  archive.append((arguments, inputs))
              if action["mnemonic"] == "BuildHermeticDebianBootstrap":
                  bootstrap.append((arguments, inputs))
              if any(
                  token.endswith("/bin/bash")
                  or token.endswith("/usr/bin/gcc")
                  or token.endswith("/usr/bin/ar")
                  or token.endswith("/usr/bin/strip")
                  or "local_config_cc" in token
                  for token in arguments
              ):
                  raise SystemExit("host compiler or shell in structured action graph")
          if len(archive) != 1 or any(
              not args
              or not args[0][0].endswith("/mkosi_debian_python/bin/python3.11")
              or not any("mkosi_debian_python/lib/" in path for path in args[1])
              for args in archive
          ):
              raise SystemExit("archive action lacks complete static Python inputs")
          if len(bootstrap) != 2 or any(
              not args
              or not args[0][0].endswith("/mkosi_debian_zig/zig")
              or not any("mkosi_debian_zig/lib/" in path for path in args[1])
              for args in bootstrap
          ):
              raise SystemExit("bootstrap action lacks complete pinned Zig inputs")
          print("structured action graph: archive=static-python bootstrap=static-zig")
          PY
          rm debian-tools-aquery.json
          echo "Debian tools archive/bootstrap graph contains only managed actions"

      - name: Verify deterministic bootstrap binaries
        if: matrix.module == '.' && matrix.bazel == '7.7.1'
        run: |
          bazel build --lockfile_mode=error \
            @mkosi_debian_tools//:launcher \
            @mkosi_debian_tools//:namespace_runner
          first_launcher="$(bazel cquery --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:launcher)"
          first_runner="$(bazel cquery --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:namespace_runner)"
          first_launcher_sha="$(sha256sum "$first_launcher" | cut -d' ' -f1)"
          first_runner_sha="$(sha256sum "$first_runner" | cut -d' ' -f1)"
          bazel clean --expunge
          bazel build --lockfile_mode=error \
            @mkosi_debian_tools//:launcher \
            @mkosi_debian_tools//:namespace_runner
          second_launcher="$(bazel cquery --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:launcher)"
          second_runner="$(bazel cquery --lockfile_mode=error \
            --output=files @mkosi_debian_tools//:namespace_runner)"
          test "$first_launcher_sha" = "$(sha256sum "$second_launcher" | cut -d' ' -f1)"
          test "$first_runner_sha" = "$(sha256sum "$second_runner" | cut -d' ' -f1)"
          echo "clean rebuild launcher SHA: $first_launcher_sha"
          echo "clean rebuild namespace runner SHA: $first_runner_sha"

      - name: Verify Linux sandbox helper
        if: matrix.module == '.'
        run: |
          install_base="$(bazel info --lockfile_mode=off install_base)"
          test -x "${install_base}/linux-sandbox"
          "${install_base}/linux-sandbox" /bin/true

      - name: Qualify host kernel in Bazel sandbox
        if: matrix.module == '.'
        run: |
          bazel shutdown
          set -o pipefail
          bazel test --lockfile_mode=off --config=kernel_preflight \
            //mkosi/private:kernel_preflight_host_test 2>&1 |
            tee kernel-preflight.log
          grep -F "Executed 1 out of 1 test" kernel-preflight.log
          ! grep -F "(cached)" kernel-preflight.log
          rm kernel-preflight.log

  lockfile:
    name: Bazel lockfile
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: "7.7.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Verify committed lockfile
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel 7.7.1"
          bazel mod deps --lockfile_mode=error

  module-resolution:
    name: Module resolution ${{ matrix.bazel }} / ${{ matrix.fixture }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - "7.7.1"
          - "8.5.1"
          - "9.2.0"
        fixture:
          - default
          - explicit
          - unsupported
          - conflicting_root
          - nonroot_name
          - root_dependency
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: rules-mkosi-module-${{ matrix.bazel }}-${{ matrix.fixture }}
          repository-cache: true

      - name: Test module resolution fixture
        run: |
          actual="$(bazel --version)"
          echo "$actual"
          test "$actual" = "bazel ${{ matrix.bazel }}"
          e2e/module_resolution/test.sh ${{ matrix.fixture }}

  lint:
    name: prek
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true
          prek-version: "0.5.0"

  conclusion:
    name: CI conclusion
    if: always()
    needs:
      - lint
      - lockfile
      - test
      - module-resolution
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |-
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
