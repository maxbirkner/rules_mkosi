name: Starlark coverage capability

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Bazel ${{ matrix.bazel }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - "8.5.1"
          - "9.2.0"
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          bazelisk-version: 1.28.0

      - name: Probe Starlark LCOV capability
        run: ./ci/check-starlark-coverage-support.sh
