name: Publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # Retries a failed publication of an existing release.
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag, such as v1.2.3
        required: true
        type: string
      release_run_id:
        description: ID of the Release workflow run that built the tag's archive and attestations
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Open BCR pull request
    # Generates the registry entry from the .bcr templates, attests it, and opens a pull request from the fork.
    # Referenced by tag, unlike other actions: the attestations name this ref as their builder, and the BCR presubmit's
    # slsa-verifier accepts only a semver tag there, so a commit SHA fails verification.
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.7.0
    permissions:
      attestations: write
      contents: write
      id-token: write
    with:
      # A personal access token opens a draft that the maintainer marks ready for review as the BCR approval.
      draft: true
      registry_fork: maxbirkner/bazel-central-registry
      release_artifacts_run_id: ${{ inputs.release_run_id || github.run_id }}
      tag_name: ${{ inputs.tag_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

  finalize:
    name: Publish GitHub release
    # The release stays a draft until publish-to-bcr has uploaded the entry attestations to it, and the BCR presubmit
    # can download the archive only after this job.
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
