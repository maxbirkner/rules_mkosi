exclude: |
  (?x)^(
    MODULE\.bazel\.lock|
    e2e/smoke/MODULE\.bazel\.lock
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: pretty-format-json
        args:
          - --autofix
          - --indent=2
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: forbid-binary-files
        name: forbid binary files
        entry: binary files must not be committed to rules_mkosi
        language: fail
        types:
          - binary
      - id: function-size
        name: function size
        entry: python3 ci/check_function_size.py
        language: system
        files: \.(py|bzl)$|^ci/function_size_baseline\.txt$
        pass_filenames: false
      - id: jscpd
        name: duplicated code (jscpd)
        entry: jscpd
        language: node
        additional_dependencies:
          - jscpd@5.4.2
        always_run: true
        pass_filenames: false

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: ec25c1dca1a4a74c0efaa48052b4ea99a9ac19d7 # frozen: 8.5.1.3
    hooks:
      - id: buildifier
        args:
          - --warnings=all
      - id: buildifier-lint
        args:
          - --warnings=all

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # frozen: v2.4.1
    hooks:
      - id: mypy
        # mypy.ini selects the checked files, so every run checks the same set.
        args: []
        additional_dependencies:
          - click==8.5.0
        files: ^((ci|mkosi|tools)/|mypy\.ini$)
        types_or:
          - ini
          - python
        pass_filenames: false

  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0 # frozen: v0.49.1
    hooks:
      - id: markdownlint-fix

  - repo: https://github.com/crate-ci/typos
    rev: 4d9c206a77c041268485162b8e2579ad7a5cb9a3 # frozen: v1.50.0
    hooks:
      - id: typos

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        types:
          - shell

  - repo: meta
    hooks:
      - id: check-useless-excludes
