# Type checking for the Python helpers in ci/, mkosi/, and tools/; run by `prek run --all-files`.
# Unannotated functions are not checked yet (check_untyped_defs is off).
[mypy]
files = ci, mkosi, tools, tools/bazel
# Host scripts such as tools/bazel and ci/*.py run on the CI runners' Python 3.10.
python_version = 3.10
# Every file is one module named after its path from the repository root, such as mkosi.private.gpt_partitions,
# even though few directories have an __init__.py.
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR
check_untyped_defs = False
warn_unused_configs = True

# Scripts import helpers from their own directory, which Python or Bazel puts on sys.path at run time.
# mypy names those files by their repository path instead, and resolving the short names too would load each
# file twice under two module names.
[mypy-action_graph_validator,bounded_reads,check_bazel_versions,check_function_size,execution_log,generate_lock,gpt_partitions,hardware_qualification_schemas,http_download,image_environment_validator,input_version,raw_image_corruption_test,raw_image_validator,raw_image_validator_cases,refresh_debian_tools,rules_mkosi_esp_manifest,secure_boot_fixtures,verity_metadata]
ignore_missing_imports = True

# Upstream mkosi shares its top-level package name with this repository's mkosi/ directory and is not installed.
[mypy-mkosi.*]
ignore_missing_imports = True

[mypy-pefile]
ignore_missing_imports = True

# Bazel provides the runfiles library as @rules_python//python/runfiles; it is not installed for mypy.
[mypy-python.runfiles]
ignore_missing_imports = True
