version: 1

# Debian trixie snapshot used to resolve the build-time userspace.  This is
# also contains the Debian essential packages needed by release images.
sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20250814T000000Z

archs:
  - amd64

packages:
  - apt
  - binutils
  - bubblewrap
  - btrfs-progs
  - ca-certificates
  - cpio
  - coreutils
  - debian-archive-keyring
  - debootstrap
  - diffutils
  - dpkg
  - dosfstools
  - e2fsprogs
  - fdisk
  - grub-efi-amd64-bin
  - grub-pc-bin
  - grub2-common
  - libarchive-tools
  - linux-image-amd64
  - libexpat1
  - libc-bin
  - libpython3.13-stdlib
  - libpython3.13-minimal
  - mtools
  - parted
  - systemd
  - systemd-boot
  - systemd-boot-efi
  - systemd-repart
  - udev
  - util-linux
  - util-linux-extra
  - dash
  - zstd
  - python3-minimal
  - python3-pefile
  - python3.13-minimal
  - media-types
  - netbase
  - tzdata
  # Required to bootstrap an offline release image from the same mirror.
  - base-files
  - bash
  - bsdutils
  - findutils
  - grep
  - gzip
  - hostname
  - init-system-helpers
  - mawk
  - ncurses-base
  - ncurses-bin
  - perl-base
  - sed
  - sysvinit-utils
