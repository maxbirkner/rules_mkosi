[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
Seed=00000000-0000-4000-8000-000000000007

[Build]
Environment=SOURCE_DATE_EPOCH=0
Environment="SYSTEMD_REPART_MKFS_OPTIONS_EXT4=-E hash_seed=00000000-0000-4000-8000-000000000007"

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
KernelCommandLine=console=ttyS0 systemd.unit=poweroff.target
SourceDateEpoch=0
RemoveFiles=/var/cache
RemoveFiles=/var/log
