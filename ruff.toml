# Host scripts such as tools/bazel and ci/action_graph_validator.py run on the CI runners' Python 3.10.
target-version = "py310"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "RUF", "ANN"]
# printf-style and str.format() calls are left as they are; rewriting them to f-strings is churn without a defect.
ignore = ["UP031", "UP032"]

# Every function needs type annotations, which also make mypy check its body. The files below predate this rule and
# are exempt; never add a file. Annotating a file fully means deleting its line, so the list only shrinks.
# hardware_qualification_schemas.py is annotated, but its JSON schema helpers still take typing.Any.
[lint.per-file-ignores]
"ci/action_graph_validator.py" = ["ANN"]
"ci/action_graph_validator_test.py" = ["ANN"]
"ci/check_function_size_test.py" = ["ANN"]
"ci/hardware_qualification_schemas.py" = ["ANN401"]
