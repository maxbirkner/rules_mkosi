# Host scripts such as tools/bazel and ci/action_graph_validator.py run on the CI runners' Python 3.10.
target-version = "py310"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "RUF", "ANN"]
# printf-style and str.format() calls are left as they are; rewriting them to f-strings is churn without a defect.
ignore = ["UP031", "UP032"]

# Every function needs type annotations, which also make mypy check its body. The files below predate this rule and
# are exempt; never add a file. Annotating a file fully means deleting its line, so the list only shrinks.
[lint.per-file-ignores]
"mkosi/debian/debian_launcher.py" = ["ANN"]
"mkosi/debian/debian_launcher_cli_test.py" = ["ANN"]
"mkosi/debian/debian_python_hermetic_test.py" = ["ANN"]
"mkosi/debian/debian_tools_security_test.py" = ["ANN"]
"mkosi/debian/extract_tree.py" = ["ANN"]
"mkosi/debian/extract_tree_test.py" = ["ANN"]
"mkosi/debian/generate_lock.py" = ["ANN"]
"mkosi/debian/generate_lock_test.py" = ["ANN"]
"mkosi/debian/http_download.py" = ["ANN"]
"mkosi/debian/http_download_test.py" = ["ANN"]
"mkosi/debian/package_archive.py" = ["ANN"]
"mkosi/debian/refresh_debian_tools.py" = ["ANN"]
"mkosi/debian/refresh_debian_tools_test.py" = ["ANN"]
"mkosi/private/openpgp.py" = ["ANN"]
"mkosi/private/partition_metadata.py" = ["ANN"]
"mkosi/private/reproducibility_manifest.py" = ["ANN"]
"mkosi/private/run_mkosi.py" = ["ANN"]
"mkosi/private/secure_boot.py" = ["ANN"]
"mkosi/private/secure_boot_image.py" = ["ANN"]
"mkosi/private/secure_boot_signer.py" = ["ANN"]
"mkosi/private/sibling_loader.py" = ["ANN"]
"mkosi/private/stage_inputs.py" = ["ANN"]
"mkosi/private/sysupdate.py" = ["ANN"]
"mkosi/private/sysupdate_signing.py" = ["ANN"]
"mkosi/private/uki_metadata.py" = ["ANN"]
"mkosi/private/verity_metadata.py" = ["ANN"]

[lint.isort]
# Upstream mkosi shares its top-level package name with this repository's mkosi/ directory.
known-first-party = ["mkosi.debian", "mkosi.private", "mkosi.tests"]
known-third-party = ["mkosi"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50
